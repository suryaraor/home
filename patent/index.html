<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patent - Adaptive Cognitive Data Fabric</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* Global Styles */
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }
        h1, h2 {
            color: #F05F40;
            margin-bottom: 20px;
        }
        p, ul {
            font-size: 16px;
            line-height: 1.6;
        }
        a {
            text-decoration: none;
            color: #F05F40;
            font-weight: bold;
        }
        a:hover {
            color: #eb3812;
        }
        
        /* Container Styles */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }

        /* Profile Box */
        .profile-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px;
            border-radius: 10px;
            background: #f0f0f0;
            margin-bottom: 30px;
        }
        .profile-box img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
        }

        /* Review List */
        .review-list {
            list-style: none;
            padding: 0;
            text-align: left;
        }
        .review-list li {
            background: #f9f9f9;
            margin: 15px 0;
            padding: 18px;
            border-radius: 8px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
        }

        footer {
            text-align: center;
            color: #777;
            margin-top: 30px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            .profile-box {
                padding: 15px;
            }
            .profile-box img {
                width: 120px;
                height: 120px;
            }
            h1, h2 {
                font-size: 28px;
            }
            p, ul {
                font-size: 14px;
            }
        }

        @media (max-width: 480px) {
            h1, h2 {
                font-size: 24px;
            }
            p, ul {
                font-size: 12px;
            }
            .profile-box {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .review-list li {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-box">
            <img src="../assets/images/profile.jpg" alt="Inventor Image"> <!-- Updated image path -->
            <h2>Adaptive Cognitive Data Fabric System</h2>
            <p>Inventors: Surya Rao Rayarao, Santhosh Kumar Pendyala, Vijay Kumar Adari, and others</p>
