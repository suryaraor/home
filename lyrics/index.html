<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lyrics Player</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Lyrics Player">
    <meta property="og:description" content="Interactive player for Sai Baba Arati, Hanuman Chalisa, Vishnu Sahasranamam in English and Telugu.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="/img/profile-pic.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Lyrics Player">
    <meta name="twitter:description" content="Interactive player for Sai Baba Arati, Hanuman Chalisa, Vishnu Sahasranamam in English and Telugu.">
    <meta name="twitter:image" content="/img/profile-pic.jpg">
    <style>
        body { background: #181818; color: #fff; font-family: sans-serif; margin: 0; }
        .header { text-align: center; padding: 1em 0; background: #222; }
        .controls { text-align: center; margin: 1em 0; }
        select, button { font-size: 1.1em; margin: 0.5em; padding: 0.3em 1em; border-radius: 0.3em; border: none; }
        #lyrics-box { max-width: 700px; margin: 2em auto; background: #222; border-radius: 1em; box-shadow: 0 0 20px #000; padding: 2em; }
        .line { display: block; padding: 0.5em 0; cursor: pointer; }
        .line.active { background: #444; border-radius: 0.3em; }
        #progress-bar { width: 100%; height: 8px; background: #333; border-radius: 4px; margin: 1em 0; }
        #progress { height: 8px; background: #4caf50; border-radius: 4px; }
        #lyrics-modal { display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.95); color:#fff; z-index:1000; overflow:auto; }
        #lyrics-modal-content { max-width:800px; margin:3em auto 2em auto; padding:2em; background:#222; border-radius:1em; box-shadow:0 0 20px #000; }
        #close-lyrics { float:right; font-size:2em; background:none; border:none; color:#fff; cursor:pointer; }
        #lyrics-content span { display:block; padding:0.2em 0; cursor:pointer; }
        @media (max-width: 600px) {
            #lyrics-box { padding: 1em; }
            #lyrics-modal-content { padding: 1em; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Lyrics Player</h1>
        <div class="controls">
            <label for="text-select">Text:</label>
            <select id="text-select">
                <option value="saibaba-arati">Sai Baba Arati</option>
                <option value="hanuman-chalisa">Hanuman Chalisa</option>
                <option value="vishnu">Vishnu Sahasranamam</option>
            </select>
            <label for="lang-select">Language:</label>
            <select id="lang-select">
                <option value="en">English</option>
                <option value="te">Telugu</option>
            </select>
            <button id="show-lyrics">Show Lyrics</button>
            <button id="decrease">-</button>
            <button id="increase">+</button>
        </div>
    </div>
    <div id="lyrics-box"></div>
    <div id="progress-bar"><div id="progress"></div></div>
    <!-- Lyrics Modal -->
    <div id="lyrics-modal">
        <div id="lyrics-modal-content">
            <button id="close-lyrics">&times;</button>
            <h2 style="text-align:center;margin-top:0;">Lyrics</h2>
            <pre id="lyrics-content" style="white-space:pre-wrap;font-size:1.1em;line-height:1.5em;background:none;border:none;color:#fff;cursor:pointer;"></pre>
        </div>
    </div>
    <script>
        // Map text/language to content file
        const contentFiles = {
            'saibaba-arati_en': 'sai-en.txt',
            'saibaba-arati_te': 'sai-te.txt',
            'hanuman-chalisa_en': 'hanuman-en.txt',
            'hanuman-chalisa_te': 'hanuman-te.txt',
            'vishnu_en': 'vishnu-en.txt',
            'vishnu_te': 'vishnu-te.txt'
        };
        let lines = [];
        let currentIdx = 0;
        let fontSize = 1.1;
        const lyricsBox = document.getElementById('lyrics-box');
        const progressBar = document.getElementById('progress');
        const textSelect = document.getElementById('text-select');
        const langSelect = document.getElementById('lang-select');
        const decreaseBtn = document.getElementById('decrease');
        const increaseBtn = document.getElementById('increase');
        const showLyricsBtn = document.getElementById('show-lyrics');
        const lyricsModal = document.getElementById('lyrics-modal');
        const closeLyricsBtn = document.getElementById('close-lyrics');
        const lyricsContent = document.getElementById('lyrics-content');

        function loadLyrics() {
            const key = textSelect.value + '_' + langSelect.value;
            const file = contentFiles[key];
            if (!file) {
                lyricsBox.innerHTML = '<p>Content not available for this selection.</p>';
                return;
            }
            fetch(file)
                .then(response => {
                    if (!response.ok) throw new Error('File not found');
                    return response.text();
                })
                .then(text => {
                    lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
                    currentIdx = 0;
                    renderLyrics();
                    updateProgress();
                })
                .catch(error => {
                    lyricsBox.innerHTML = '<p>Error loading content: ' + error.message + '</p>';
                });
        }
        function renderLyrics() {
            lyricsBox.innerHTML = '';
            lines.forEach((line, i) => {
                const span = document.createElement('span');
                span.className = 'line' + (i === currentIdx ? ' active' : '');
                span.textContent = line;
                span.style.fontSize = fontSize + 'em';
                span.onclick = () => { currentIdx = i; renderLyrics(); updateProgress(); };
                lyricsBox.appendChild(span);
            });
        }
        function updateProgress() {
            if (lines.length > 0) {
                progressBar.style.width = ((currentIdx + 1) / lines.length * 100) + '%';
            } else {
                progressBar.style.width = '0%';
            }
        }
        decreaseBtn.onclick = () => { fontSize = Math.max(0.7, fontSize - 0.1); renderLyrics(); };
        increaseBtn.onclick = () => { fontSize = Math.min(2.5, fontSize + 0.1); renderLyrics(); };
        textSelect.onchange = loadLyrics;
        langSelect.onchange = loadLyrics;
        // Modal logic
        showLyricsBtn.onclick = () => {
            lyricsContent.innerHTML = lines.map((line, i) => `<span data-line="${i}">${line.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</span>`).join('');
            lyricsModal.style.display = 'block';
        };
        lyricsContent.onclick = (e) => {
            if (e.target && e.target.dataset && e.target.dataset.line) {
                currentIdx = parseInt(e.target.dataset.line, 10);
                renderLyrics();
                updateProgress();
                lyricsModal.style.display = 'none';
            }
        };
        closeLyricsBtn.onclick = () => { lyricsModal.style.display = 'none'; };
        lyricsModal.onclick = (e) => { if (e.target === lyricsModal) lyricsModal.style.display = 'none'; };
        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowDown') { currentIdx = Math.min(lines.length - 1, currentIdx + 1); renderLyrics(); updateProgress(); }
            if (e.key === 'ArrowUp') { currentIdx = Math.max(0, currentIdx - 1); renderLyrics(); updateProgress(); }
        });
        // Initial load
        loadLyrics();
    </script>
</body>
</html>
