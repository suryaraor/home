<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lyrics Player</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Lyrics Player">
    <meta property="og:description" content="Interactive player for Sai Baba Arati, Hanuman Chalisa, Vishnu Sahasranamam in English and Telugu.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="/img/profile-pic.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Lyrics Player">
    <meta name="twitter:description" content="Interactive player for Sai Baba Arati, Hanuman Chalisa, Vishnu Sahasranamam in English and Telugu.">
    <meta name="twitter:image" content="/img/profile-pic.jpg">
    <style>
        /* Remove tap/click highlight color on mobile and desktop */
        #tap-area, #tap-area-left {
            -webkit-tap-highlight-color: transparent;
            outline: none;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #222;
            color: #fff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            overflow: hidden;
        }
        #container {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        #text {
            font-size: 10vw;
            width: 96vw;
            max-width: 96vw;
            max-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            word-break: break-word;
            overflow-wrap: break-word;
            white-space: normal;
        }
        #tap-area {
            position: absolute;
            top: 0;
            right: 0;
            width: 50vw;
            height: 100vh;
            cursor: pointer;
        }
        #tap-area-left {
            position: absolute;
            top: 0;
            left: 0;
            width: 50vw;
            height: 100vh;
            cursor: pointer;
        }
        .header { text-align: center; padding: 1em 0; background: #222; position: fixed; top: 0; width: 100vw; z-index: 10; }
        .controls { text-align: center; margin: 1em 0; }
        select, button { font-size: 1.1em; margin: 0.5em; padding: 0.3em 1em; border-radius: 0.3em; border: none; }
        #lyrics-modal { display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.95); color:#fff; z-index:1000; overflow:auto; }
        #lyrics-modal-content { max-width:800px; margin:3em auto 2em auto; padding:2em; background:#222; border-radius:1em; box-shadow:0 0 20px #000; }
        #close-lyrics { float:right; font-size:2em; background:none; border:none; color:#fff; cursor:pointer; }
        #lyrics-content span { display:block; padding:0.2em 0; cursor:pointer; }
        #progress-bar-container { position:fixed; bottom:0; left:0; width:100vw; height:2.5em; background:#333; z-index:10; }
        #progress-bar { height:100%; background:#4caf50; width:0%; transition:width 0.3s; }
        #progress-label { position:absolute; bottom:0; left:0; width:100vw; text-align:center; color:#fff; font-size:1em; line-height:2.5em; pointer-events:none; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Lyrics Player</h1>
        <div class="controls">
            <label for="text-select">Text:</label>
            <select id="text-select">
                <option value="saibaba-arati">Sai Baba Arati</option>
                <option value="hanuman-chalisa">Hanuman Chalisa</option>
                <option value="vishnu">Vishnu Sahasranamam</option>
            </select>
            <label for="lang-select">Language:</label>
            <select id="lang-select">
                <option value="en">English</option>
                <option value="te">Telugu</option>
            </select>
            <button id="show-lyrics">Show Lyrics</button>
            <button id="decrease">-</button>
            <button id="increase">+</button>
        </div>
    </div>
    <div id="container" style="margin-top:3em;">
        <div id="text"></div>
        <div id="tap-area"></div>
        <div id="tap-area-left"></div>
    </div>
    <div id="progress-bar-container">
        <div id="progress-bar"></div>
        <div id="progress-label">0%</div>
    </div>
    <!-- Lyrics Modal -->
    <div id="lyrics-modal">
        <div id="lyrics-modal-content">
            <button id="close-lyrics">&times;</button>
            <h2 style="text-align:center;margin-top:0;">Lyrics</h2>
            <pre id="lyrics-content" style="white-space:pre-wrap;font-size:1.1em;line-height:1.5em;background:none;border:none;color:#fff;cursor:pointer;"></pre>
        </div>
    </div>
    <script>
        // Map text/language to content file
        const contentFiles = {
            'saibaba-arati_en': 'sai-en.txt',
            'saibaba-arati_te': 'sai-te.txt',
            'hanuman-chalisa_en': 'hanuman-en.txt',
            'hanuman-chalisa_te': 'hanuman-te.txt',
            'vishnu_en': 'vishnu-en.txt',
            'vishnu_te': 'vishnu-te.txt'
        };
        let lines = [];
        let currentIdx = 0;
        let fontSize = 10; // vw
        const textDiv = document.getElementById('text');
        const progressBar = document.getElementById('progress-bar');
        const progressLabel = document.getElementById('progress-label');
        const textSelect = document.getElementById('text-select');
        const langSelect = document.getElementById('lang-select');
        const decreaseBtn = document.getElementById('decrease');
        const increaseBtn = document.getElementById('increase');
        const showLyricsBtn = document.getElementById('show-lyrics');
        const lyricsModal = document.getElementById('lyrics-modal');
        const closeLyricsBtn = document.getElementById('close-lyrics');
        const lyricsContent = document.getElementById('lyrics-content');
        const tapArea = document.getElementById('tap-area');
        const tapAreaLeft = document.getElementById('tap-area-left');

        function showLine(i) {
            textDiv.textContent = lines[i] || '';
            updateProgress();
        }

        function updateProgress() {
            if (lines.length === 0) {
                progressBar.style.width = '0%';
                progressLabel.textContent = '0%';
                return;
            }
            let percent = Math.round(((currentIdx + 1) / lines.length) * 100);
            progressBar.style.width = percent + '%';
            progressLabel.textContent = percent + '%';
        }

        function updateFontSize() {
            textDiv.style.fontSize = fontSize + 'vw';
        }

        function loadLyrics() {
            const key = textSelect.value + '_' + langSelect.value;
            const file = contentFiles[key];
            if (!file) {
                textDiv.textContent = 'Content not available for this selection.';
                return;
            }
            fetch(file)
                .then(response => {
                    if (!response.ok) throw new Error('File not found');
                    return response.text();
                })
                .then(text => {
                    lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
                    currentIdx = 0;
                    showLine(currentIdx);
                    updateFontSize();
                })
                .catch(error => {
                    textDiv.textContent = 'Error loading content: ' + error.message;
                });
        }

        function renderLyrics() {
            // This function is kept for compatibility but not used in single-line mode
            showLine(currentIdx);
        }
        decreaseBtn.onclick = () => { 
            if (fontSize > 4) fontSize -= 1; 
            updateFontSize(); 
        };
        increaseBtn.onclick = () => { 
            if (fontSize < 20) fontSize += 1; 
            updateFontSize(); 
        };
        textSelect.onchange = loadLyrics;
        langSelect.onchange = loadLyrics;

        // Tap navigation
        tapArea.onclick = () => {
            if (currentIdx < lines.length - 1) {
                currentIdx++;
                showLine(currentIdx);
            }
        };
        tapAreaLeft.onclick = () => {
            if (currentIdx > 0) {
                currentIdx--;
                showLine(currentIdx);
            }
        };

        // Touch/swipe support
        let startX = null;
        tapArea.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
        });
        tapArea.addEventListener('touchend', (e) => {
            if (startX !== null) {
                let endX = e.changedTouches[0].clientX;
                if (endX > startX && currentIdx < lines.length - 1) {
                    currentIdx++;
                    showLine(currentIdx);
                }
                startX = null;
            }
        });
        tapAreaLeft.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
        });
        tapAreaLeft.addEventListener('touchend', (e) => {
            if (startX !== null) {
                let endX = e.changedTouches[0].clientX;
                if (endX < startX && currentIdx > 0) {
                    currentIdx--;
                    showLine(currentIdx);
                }
                startX = null;
            }
        });

        // Progress bar click to jump
        const progressBarContainer = document.getElementById('progress-bar-container');
        progressBarContainer.onclick = (e) => {
            if (!lines.length) return;
            const rect = progressBarContainer.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const percent = x / rect.width;
            const newIdx = Math.floor(percent * lines.length);
            currentIdx = Math.max(0, Math.min(lines.length - 1, newIdx));
            showLine(currentIdx);
        };
        // Modal logic
        showLyricsBtn.onclick = () => {
            lyricsContent.innerHTML = lines.map((line, i) => `<span data-line="${i}">${line.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</span>`).join('');
            lyricsModal.style.display = 'block';
        };
        lyricsContent.onclick = (e) => {
            if (e.target && e.target.dataset && e.target.dataset.line) {
                currentIdx = parseInt(e.target.dataset.line, 10);
                showLine(currentIdx);
                lyricsModal.style.display = 'none';
            }
        };
        closeLyricsBtn.onclick = () => { lyricsModal.style.display = 'none'; };
        lyricsModal.onclick = (e) => { if (e.target === lyricsModal) lyricsModal.style.display = 'none'; };
        
        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { 
                if (currentIdx < lines.length - 1) {
                    currentIdx++;
                    showLine(currentIdx);
                }
            }
            if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') { 
                if (currentIdx > 0) {
                    currentIdx--;
                    showLine(currentIdx);
                }
            }
        });
        
        // Initial load
        loadLyrics();
    </script>
</body>
</html>
