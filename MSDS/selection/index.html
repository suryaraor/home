<html lang="en">
<head>

    <title>MSDS Course Selection Guide - University of Texas at Austin</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ut-orange: #BF5700;
            --ut-charcoal: #333F48;
            --ut-light-gray: #F8F9FA;
            --ut-dark-gray: #6C757D;
            --white: #FFFFFF;
            --green: #28a745;
            --red: #dc3545;
            --yellow: #ffc107;
            --blue: #007bff;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            color: var(--ut-charcoal);
            background: linear-gradient(135deg, var(--ut-light-gray) 0%, #E9ECEF 100%);
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, var(--ut-orange) 0%, #D15500 100%);
            color: var(--white);
            padding: 2rem 0;
            text-align: center;
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="2" fill="rgba(255,255,255,0.1)"/><circle cx="20" cy="20" r="1" fill="rgba(255,255,255,0.1)"/><circle cx="80" cy="30" r="1.5" fill="rgba(255,255,255,0.1)"/><circle cx="30" cy="80" r="1" fill="rgba(255,255,255,0.1)"/><circle cx="70" cy="70" r="2" fill="rgba(255,255,255,0.1)"/></svg>') repeat;
            opacity: 0.3;
        }

        .header-content {
            position: relative;
            z-index: 1;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header .subtitle {
            font-size: 1.1rem;
            font-weight: 400;
            opacity: 0.95;
        }

        .progress-tracker {
            background: var(--white);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: var(--shadow);
            border-left: 4px solid var(--green);
        }

        .progress-header {
            display: flex;
            justify-content: between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .progress-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--ut-charcoal);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .progress-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .progress-item {
            background: var(--ut-light-gray);
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
        }

        .progress-number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--ut-orange);
            margin-bottom: 0.25rem;
        }

        .progress-label {
            font-size: 0.9rem;
            color: var(--ut-dark-gray);
            font-weight: 500;
        }

        .progress-bar-full {
            width: 100%;
            height: 12px;
            background: #e9ecef;
            border-radius: 6px;
            overflow: hidden;
            margin: 0.5rem 0;
        }

        .progress-bar-fill-full {
            height: 100%;
            background: linear-gradient(90deg, var(--green) 0%, var(--ut-orange) 100%);
            border-radius: 6px;
            transition: width 0.5s ease;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        .main-content {
            padding: 2rem 0;
        }

        .filters {
            background: var(--white);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: var(--shadow);
            border-left: 4px solid var(--ut-orange);
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            align-items: center;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .filter-label {
            font-weight: 600;
            color: var(--ut-orange);
            font-size: 0.9rem;
        }

        .filter-select {
            padding: 0.5rem;
            border: 2px solid var(--ut-light-gray);
            border-radius: 6px;
            font-size: 0.9rem;
            transition: border-color 0.3s ease;
        }

        .filter-select:focus {
            outline: none;
            border-color: var(--ut-orange);
        }

        .course-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .course-card {
            background: var(--white);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            border-left: 4px solid transparent;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .course-card.selected {
            background: rgba(191, 87, 0, 0.05);
            border-left-color: var(--ut-orange);
            box-shadow: 0 4px 12px rgba(191, 87, 0, 0.2);
        }

        .course-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .course-card.required {
            border-left-color: var(--red);
        }

        .course-card.elective {
            border-left-color: var(--blue);
        }

        .course-card.elective-1 {
            border-left-color: var(--blue);
        }

        .course-card.elective-2 {
            border-left-color: #6610f2;
        }

        .course-card.foundational {
            border-left-color: var(--green);
        }

        .course-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .course-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--ut-charcoal);
            margin-bottom: 0.25rem;
        }

        .course-code {
            font-size: 0.85rem;
            color: var(--ut-dark-gray);
            font-weight: 500;
        }

        .course-type {
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .course-type.required {
            background: rgba(220, 53, 69, 0.1);
            color: var(--red);
        }

        .course-type.elective {
            background: rgba(0, 123, 255, 0.1);
            color: var(--blue);
        }

        .course-type.elective-1 {
            background: rgba(0, 123, 255, 0.1);
            color: var(--blue);
        }

        .course-type.elective-2 {
            background: rgba(102, 16, 242, 0.1);
            color: #6610f2;
        }

        .course-type.foundational {
            background: rgba(40, 167, 69, 0.1);
            color: var(--green);
        }

        .recommendation-badge {
            position: absolute;
            bottom: 0.75rem;
            right: 0.75rem;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .recommendation-badge.recommend {
            background: var(--green);
            color: var(--white);
        }

        .recommendation-badge.caution {
            background: var(--yellow);
            color: var(--ut-charcoal);
        }

        .recommendation-badge.avoid {
            background: var(--red);
            color: var(--white);
        }

        .course-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .stat-item {
            text-align: center;
            padding: 0.5rem;
            background: var(--ut-light-gray);
            border-radius: 6px;
        }

        .stat-value {
            font-weight: 700;
            font-size: 1rem;
            color: var(--ut-orange);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--ut-dark-gray);
        }

        .course-description {
            font-size: 0.9rem;
            color: var(--ut-dark-gray);
            line-height: 1.5;
            margin-bottom: 1rem;
        }

        .course-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .tag {
            padding: 0.25rem 0.5rem;
            background: rgba(191, 87, 0, 0.1);
            color: var(--ut-orange);
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 2147483647;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            overflow-y: auto;
        }

        .modal-content {
            background-color: var(--white);
            margin: 2% auto;
            padding: 0;
            border-radius: 12px;
            width: 90%;
            max-width: 1000px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            background: linear-gradient(135deg, var(--ut-orange), #D15500);
            color: var(--white);
            padding: 2rem;
            border-radius: 12px 12px 0 0;
            position: relative;
        }

        .close {
            position: absolute;
            right: 1.5rem;
            top: 1.5rem;
            color: var(--white);
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }

        .close:hover {
            opacity: 0.7;
        }

        .modal-body {
            padding: 2rem;
        }

        .recommendation-section {
            background: var(--ut-light-gray);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border-left: 4px solid var(--ut-orange);
        }

        .recommendation-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .recommendation-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: var(--white);
        }

        .recommendation-icon.recommend {
            background: var(--green);
        }

        .recommendation-icon.caution {
            background: var(--yellow);
            color: var(--ut-charcoal);
        }

        .recommendation-icon.avoid {
            background: var(--red);
        }

        .recommendation-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--ut-charcoal);
        }

        .recommendation-subtitle {
            font-size: 1rem;
            color: var(--ut-dark-gray);
        }

        .reasons-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-top: 1.5rem;
        }

        .reasons-section {
            background: var(--white);
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
        }

        .reasons-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .reasons-title.pros {
            color: var(--green);
        }

        .reasons-title.cons {
            color: var(--red);
        }

        .reason-item {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            margin-bottom: 1rem;
            padding: 1rem;
            background: var(--ut-light-gray);
            border-radius: 6px;
        }

        .reason-number {
            background: var(--ut-orange);
            color: var(--white);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 600;
            flex-shrink: 0;
        }

        .reason-text {
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .course-details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .detail-section {
            background: var(--ut-light-gray);
            border-radius: 8px;
            padding: 1.5rem;
        }

        .detail-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--ut-orange);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .progress-bar-container {
            margin-bottom: 1rem;
        }

        .progress-bar-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .difficulty {
            background: linear-gradient(90deg, var(--green) 0%, var(--yellow) 50%, var(--red) 100%);
        }

        .workload {
            background: linear-gradient(90deg, var(--green) 0%, var(--yellow) 50%, var(--red) 100%);
        }

        .rating {
            background: linear-gradient(90deg, var(--red) 0%, var(--yellow) 50%, var(--green) 100%);
        }

        @media (max-width: 768px) {
            .course-grid {
                grid-template-columns: 1fr;
            }
            
            .reasons-grid {
                grid-template-columns: 1fr;
            }
            
            .course-details-grid {
                grid-template-columns: 1fr;
            }
            
            .modal-content {
                width: 95%;
                margin: 1% auto;
            }
        }
    </style>
</head>

                        <div style="font-size: 0.8rem; color: var(--ut-dark-gray);">Target: 2 of 5</div>
                    </div>
                </div>
            </div>

            <!-- Filters -->
            <div class="filters">
                <div class="filter-grid">
                    <div class="filter-group">
                        <label class="filter-label">Course Type</label>
                        <select class="filter-select" id="typeFilter">
                            <option value="all">All Courses</option>
                            <option value="required">Required Core</option>
                            <option value="foundational">Foundational</option>
                            <option value="elective-1">Elective Group 1</option>
                            <option value="elective-2">Elective Group 2</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label class="filter-label">Difficulty Level</label>
                        <select class="filter-select" id="difficultyFilter">
                            <option value="all">All Levels</option>
                            <option value="easy">Easy (3.0-3.5)</option>
                            <option value="moderate">Moderate (3.5-4.0)</option>
                            <option value="hard">Hard (4.0-4.5)</option>
                            <option value="very-hard">Very Hard (4.5+)</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label class="filter-label">Workload</label>
                        <select class="filter-select" id="workloadFilter">
                            <option value="all">All Workloads</option>
                            <option value="light">Light (10-14 hrs)</option>
                            <option value="moderate">Moderate (14-18 hrs)</option>
                            <option value="heavy">Heavy (18-22 hrs)</option>
                            <option value="very-heavy">Very Heavy (22+ hrs)</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label class="filter-label">Recommendation</label>
                        <select class="filter-select" id="recommendationFilter">
                            <option value="all">All Recommendations</option>
                            <option value="recommend">Recommended</option>
                            <option value="caution">Consider Carefully</option>
                            <option value="avoid">Not Recommended</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label class="filter-label">Search</label>
                        <input type="text" class="filter-select" id="searchFilter" placeholder="Search courses...">
                    </div>
                </div>
            </div>

            <!-- Course Grid -->
            <div class="course-grid" id="courseGrid">
                <!-- Courses will be populated by JavaScript -->
            </div>
        </div>
    </main>

    <!-- Modal -->
    <div id="courseModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="close">&times;</span>
                <div id="modalHeader"></div>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Modal content will be populated by JavaScript -->
            </div>
        </div>
    </div>

            if (event) {

            if (selectedCourses.has(courseId)) {

                selectedCourses.add(courseId);
            }
            
            updateProgressTracker();
            displayCourses(getCurrentlyDisplayedCourses());

        // Update progress tracker
        function updateProgressTracker() {
            const selectedCoursesArray = Array.from(selectedCourses);
            const selectedCourseObjects = selectedCoursesArray.map(id => courses.find(c => c.id === id));
            
            const counts = {
                total: selectedCoursesArray.length,
                required: selectedCourseObjects.filter(c => c.type === 'required').length,
                foundational: selectedCourseObjects.filter(c => c.type === 'foundational').length,
                elective1: selectedCourseObjects.filter(c => c.type === 'elective-1').length,
                elective2: selectedCourseObjects.filter(c => c.type === 'elective-2').length
            };

            const targets = {
                total: 10,
                required: 3,
                foundational: 2,
                elective1: 3,
                elective2: 2
            };

            // Update counts
            document.getElementById('totalSelected').textContent = counts.total;
            document.getElementById('requiredSelected').textContent = counts.required;
            document.getElementById('foundationalSelected').textContent = counts.foundational;
            document.getElementById('elective1Selected').textContent = counts.elective1;
            document.getElementById('elective2Selected').textContent = counts.elective2;

            // Update progress bars
            document.getElementById('totalProgress').style.width = `${Math.min(100, (counts.total / targets.total) * 100)}%`;
            document.getElementById('requiredProgress').style.width = `${Math.min(100, (counts.required / targets.required) * 100)}%`;
            document.getElementById('foundationalProgress').style.width = `${Math.min(100, (counts.foundational / targets.foundational) * 100)}%`;
            document.getElementById('elective1Progress').style.width = `${Math.min(100, (counts.elective1 / targets.elective1) * 100)}%`;
            document.getElementById('elective2Progress').style.width = `${Math.min(100, (counts.elective2 / targets.elective2) * 100)}%`;

        // Filter courses
        function filterCourses() {
            const typeFilter = document.getElementById('typeFilter').value;
            const difficultyFilter = document.getElementById('difficultyFilter').value;
            const workloadFilter = document.getElementById('workloadFilter').value;
            const recommendationFilter = document.getElementById('recommendationFilter').value;
            const searchFilter = document.getElementById('searchFilter').value.toLowerCase();

            let filteredCourses = courses;

            // Type filter
            if (typeFilter !== 'all') {
                filteredCourses = filteredCourses.filter(course => course.type === typeFilter);
            }

            // Recommendation filter
            if (recommendationFilter !== 'all') {
                filteredCourses = filteredCourses.filter(course => course.recommendation === recommendationFilter);
            }

            // Difficulty filter
            if (difficultyFilter !== 'all') {
                const ranges = {
                    'easy': [3.0, 3.5],
                    'moderate': [3.5, 4.0],
                    'hard': [4.0, 4.5],
                    'very-hard': [4.5, 5.0]
                };
                const [min, max] = ranges[difficultyFilter];
                filteredCourses = filteredCourses.filter(course => course.difficulty >= min && course.difficulty < max);
            }

            // Workload filter
            if (workloadFilter !== 'all') {
                const ranges = {
                    'light': [10, 14],
                    'moderate': [14, 18],
                    'heavy': [18, 22],
                    'very-heavy': [22, 30]
                };
                const [min, max] = ranges[workloadFilter];
                filteredCourses = filteredCourses.filter(course => course.workload >= min && course.workload < max);
            }

            // Search filter
            if (searchFilter) {
                filteredCourses = filteredCourses.filter(course => 
                    course.title.toLowerCase().includes(searchFilter) ||
                    course.code.toLowerCase().includes(searchFilter) ||
                    course.description.toLowerCase().includes(searchFilter) ||
                    course.topics.some(topic => topic.toLowerCase().includes(searchFilter))
                );
            }

            displayCourses(filteredCourses);
        }

        // Display courses
        function displayCourses(coursesToDisplay) {
            currentlyDisplayedCourses = coursesToDisplay;
            const courseGrid = document.getElementById('courseGrid');
            courseGrid.innerHTML = coursesToDisplay.map(course => createCourseCard(course)).join('');
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            displayCourses(courses);
            updateProgressTracker();

            // Add event listeners for filters
            document.getElementById('typeFilter').addEventListener('change', filterCourses);
            document.getElementById('difficultyFilter').addEventListener('change', filterCourses);
            document.getElementById('workloadFilter').addEventListener('change', filterCourses);
            document.getElementById('recommendationFilter').addEventListener('change', filterCourses);
            document.getElementById('searchFilter').addEventListener('input', filterCourses);
        });

        // Make functions globally available
        window.openCourseModal = openCourseModal;
        window.toggleCourseSelection = toggleCourseSelection;
    </script>
</body>
</html>
