<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        .burger {
            position: fixed;
            top: 0.7em;
            left: 0.7em;
            z-index: 1001;
            width: 2.2em;
            height: 2.2em;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
        }
        .burger span {
            display: block;
            height: 0.35em;
            width: 100%;
            background: #fff;
            border-radius: 0.2em;
        }
        #settings-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.92);
            z-index: 2000;
            color: #fff;
        }
        #settings-content {
            max-width: 400px;
            margin: 5em auto;
            background: #222;
            border-radius: 1em;
            padding: 2em;
            box-shadow: 0 0 20px #000;
        }
        #settings-content h2 {
            margin-top: 0;
            text-align: center;
        }
        #settings-content label {
            display: block;
            margin: 1em 0 0.5em 0;
        }
        #settings-content select, #settings-content button {
            width: 100%;
            font-size: 1.1em;
            margin-bottom: 1em;
            padding: 0.5em;
            border-radius: 0.3em;
            border: none;
        }
        #settings-close {
            float: right;
            font-size: 2em;
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vishnu Sahasranamam Lyrics Player | విష్ణు సహస్రనామం లిరిక్స్ ప్లేయర్</title>
    <meta name="description" content="Mobile-friendly Vishnu Sahasranamam lyrics player. Read, recite, and navigate through full lyrics in Telugu, Hindi, and English pronunciation. Perfect for chanting, learning, and sharing.">
    <meta property="og:title" content="Vishnu Sahasranamam Lyrics Player | విష్ణు సహస్రనామం లిరిక్స్ ప్లేయర్" />
    <meta property="og:description" content="Mobile-friendly Vishnu Sahasranamam lyrics player. Read, recite, and navigate through full lyrics in Telugu, Hindi, and English pronunciation. Perfect for chanting, learning, and sharing." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yourdomain.com/vishnu/" />
    <meta property="og:image" content="https://en.wikipedia.org/wiki/Vishnu_Sahasranama#/media/File:Vishnu_sahasranama_manuscript,_c1690.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vishnu Sahasranamam Lyrics Player | విష్ణు సహస్రనామం లిరిక్స్ ప్లేయర్" />
    <meta name="twitter:description" content="Mobile-friendly Vishnu Sahasranamam lyrics player. Read, recite, and navigate through full lyrics in Telugu, Hindi, and English pronunciation. Perfect for chanting, learning, and sharing." />
    <meta name="twitter:image" content="https://en.wikipedia.org/wiki/Vishnu_Sahasranama#/media/File:Vishnu_sahasranama_manuscript,_c1690.jpg" />
    <style>
        /* Remove tap/click highlight color on mobile and desktop */
        #tap-area, #tap-area-left {
            -webkit-tap-highlight-color: transparent;
            outline: none;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #222;
            color: #fff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            overflow: hidden;
        }
        #container {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        #text {
            font-size: 10vw;
            width: 96vw;
            max-width: 96vw;
            max-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            word-break: break-word;
            overflow-wrap: break-word;
            white-space: normal;
        }
        #tap-area {
            position: absolute;
            top: 0;
            right: 0;
            width: 50vw;
            height: 100vh;
            cursor: pointer;
        }
        #tap-area-left {
            position: absolute;
            top: 0;
            left: 0;
            width: 50vw;
            height: 100vh;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="burger" id="burger-menu" title="Settings">
        <span></span>
        <span></span>
        <span></span>
    </div>
    <div id="settings-modal">
        <div id="settings-content">
            <button id="settings-close">&times;</button>
            <h2>Settings</h2>
            <label for="lang-select">Language:</label>
            <select id="lang-select">
                <option value="en">English</option>
                <option value="te">Telugu</option>
            </select>
            <label for="lyrics-select">Lyrics:</label>
            <select id="lyrics-select">
                <option value="saibaba-arati">Sai Baba Arati</option>
                <option value="hanuman-chalisa">Hanuman Chalisa</option>
                <option value="vishnu">Vishnu Sahasranamam</option>
            </select>
            <button id="go-btn">Go</button>
        </div>
    </div>
    <div style="position:fixed;top:0;left:0;width:100vw;z-index:10;text-align:center;background:#222;">
        <button id="decrease" style="font-size:2em;margin:0.5em;">-</button>
        <button id="increase" style="font-size:2em;margin:0.5em;">+</button>
    </div>
    <div id="container" style="margin-top:3em;">
    <div id="text"></div>
    <div id="tap-area"></div>
    <div id="tap-area-left"></div>
    </div>
    <div id="progress-bar-container" style="position:fixed;bottom:0;left:0;width:100vw;height:2.5em;background:#333;z-index:10;">
    <div id="progress-bar" style="height:100%;background:#4caf50;width:0%;transition:width 0.3s;"></div>
    <div id="progress-label" style="position:absolute;bottom:0;left:0;width:100vw;text-align:center;color:#fff;font-size:1em;line-height:2.5em;pointer-events:none;">0%</div>
    </div>
    <script>
        // Burger/settings menu logic
        const burger = document.getElementById('burger-menu');
        const settingsModal = document.getElementById('settings-modal');
        const settingsClose = document.getElementById('settings-close');
        const langSelect = document.getElementById('lang-select');
        const lyricsSelect = document.getElementById('lyrics-select');
        const goBtn = document.getElementById('go-btn');

        // Set initial values based on current page
        langSelect.value = 'en';
        lyricsSelect.value = 'vishnu';

        burger.onclick = () => { settingsModal.style.display = 'block'; };
        settingsClose.onclick = () => { settingsModal.style.display = 'none'; };
        settingsModal.onclick = (e) => { if (e.target === settingsModal) settingsModal.style.display = 'none'; };

        goBtn.onclick = () => {
            let lang = langSelect.value;
            let lyrics = lyricsSelect.value;
            let base = '';
            if (lyrics === 'saibaba-arati') base = (lang === 'te') ? '/sai/' : '/saibaba-arati/';
            if (lyrics === 'hanuman-chalisa') base = (lang === 'te') ? '/te/hanuman-chalisa/' : '/hanuman-chalisa/';
            if (lyrics === 'vishnu') base = '/vishnu/';
            window.location.href = base;
        };
        // Make progress bar clickable to jump to a specific line
        const progressBarContainer = document.getElementById('progress-bar-container');
        progressBarContainer.addEventListener('click', function(e) {
            if (!lines.length) return;
            const rect = progressBarContainer.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const percent = x / rect.width;
            const newIdx = Math.floor(percent * lines.length);
            idx = Math.max(0, Math.min(lines.length - 1, newIdx));
            showLine(idx);
        });
        let lines = [];
        let idx = 0;
        let fontSize = 10; // vw
        const textDiv = document.getElementById('text');
        const tapArea = document.getElementById('tap-area');
    const increaseBtn = document.getElementById('increase');
    const decreaseBtn = document.getElementById('decrease');
    const progressBar = document.getElementById('progress-bar');
    const progressLabel = document.getElementById('progress-label');
    const tapAreaLeft = document.getElementById('tap-area-left');
        function showLine(i) {
            textDiv.textContent = lines[i] || '';
            updateProgressBar();
        }
        function updateProgressBar() {
            if (lines.length === 0) {
                progressBar.style.width = '0%';
                progressLabel.textContent = '0%';
                return;
            }
            let percent = Math.round(((idx + 1) / lines.length) * 100);
            progressBar.style.width = percent + '%';
            progressLabel.textContent = percent + '%';
        }
        function updateFontSize() {
            textDiv.style.fontSize = fontSize + 'vw';
        }
        // Load lines from pronounciation.txt
        fetch('content.txt')
            .then(response => response.text())
            .then(text => {
                lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
                showLine(idx);
                updateFontSize();
            });
        tapArea.addEventListener('click', function(e) {
            if (idx < lines.length - 1) {
                idx++;
                showLine(idx);
            }
        });
        tapAreaLeft.addEventListener('click', function(e) {
            if (idx > 0) {
                idx--;
                showLine(idx);
            }
        });
        // Optional: swipe support for mobile
        let startX = null;
        tapArea.addEventListener('touchstart', function(e) {
            startX = e.touches[0].clientX;
        });
        tapArea.addEventListener('touchend', function(e) {
            if (startX !== null) {
                let endX = e.changedTouches[0].clientX;
                if (endX > startX && idx < lines.length - 1) {
                    idx++;
                    showLine(idx);
                }
                startX = null;
            }
        });
        tapAreaLeft.addEventListener('touchstart', function(e) {
            startX = e.touches[0].clientX;
        });
        tapAreaLeft.addEventListener('touchend', function(e) {
            if (startX !== null) {
                let endX = e.changedTouches[0].clientX;
                if (endX < startX && idx > 0) {
                    idx--;
                    showLine(idx);
                }
                startX = null;
            }
        });
        increaseBtn.addEventListener('click', function() {
            if (fontSize < 20) fontSize += 1;
            updateFontSize();
        });
        decreaseBtn.addEventListener('click', function() {
            if (fontSize > 4) fontSize -= 1;
            updateFontSize();
        });
    </script>
</body>
</html>
