---
layout: default
---
<!-- Blog index page for posts under /blog/_posts -->
<div class="container">
  <div style="display: flex; justify-content: flex-end; gap: 1.5rem; margin-bottom: 1.5rem;">
    <a href="{{ site.baseurl }}/blog/" style="font-weight:600;">Blog Home</a>
    <a href="{{ site.baseurl }}/../index.html" style="font-weight:600;">Author Profile</a>
  </div>
  <h1>My Blog Posts</h1>
  <ul>
    {% for post in site.posts %}
      <li>
  <div class="blog-title"><a class="blog-link" href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a></div>
        <div class="blog-meta">{{ post.date | date: "%B %d, %Y" }}</div>
      </li>
    {% endfor %}
  </ul>
  {% if site.posts == empty %}
    <div class="no-posts">No blog posts found.</div>
  {% endif %}
  <a href="{{ site.baseurl }}/blog/" style="display:block; margin-top:2.5rem; color:#555;">&larr; Back to Home</a>
  <a href="{{ site.baseurl }}/../index.html" style="display:block; margin-top:2.5rem; color:#555;">&larr; Author Profile</a>
</div>
