<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #faf9f7; color: #222; margin: 0; padding: 0; }
        .container { max-width: 700px; margin: 2.5rem auto; background: #fff; border-radius: 10px; box-shadow: 0 2px 16px #0001; padding: 2.5rem; }
        h1 { font-size: 2.2rem; color: #BF5700; margin-bottom: 1.5rem; }
        ul { list-style: none; padding: 0; }
        li { margin-bottom: 1.5rem; }
        a.blog-link { text-decoration: none; color: #BF5700; font-size: 1.25rem; font-weight: 600; }
        a.blog-link:hover { text-decoration: underline; }
        .blog-title { margin-bottom: 0.2rem; }
        .blog-meta { color: #888; font-size: 0.95rem; margin-bottom: 0.5rem; }
        .no-posts { color: #aaa; font-size: 1.1rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>My Blog Posts</h1>
        <ul id="blog-list"></ul>
        <div class="no-posts" id="no-posts" style="display:none;">No blog posts found.</div>
        <a href="../index.html" style="display:block; margin-top:2.5rem; color:#555;">&larr; Back to Home</a>
    </div>
    <script>
    // List all .htm files in this folder and show their titles
    async function fetchBlogPosts() {
        // List of blog post files (auto-generated by build or manually updated)
        const posts = [
            { file: 'springTransactionManagement.htm' }
        ];
        const blogList = document.getElementById('blog-list');
        let found = false;
        for (const post of posts) {
            try {
                const resp = await fetch(post.file);
                const text = await resp.text();
                // Try to extract <title> or first <h1> or fallback to filename
                let title = post.file;
                const titleMatch = text.match(/<title>(.*?)<\/title>/i);
                if (titleMatch) {
                    title = titleMatch[1].trim();
                } else {
                    const h1Match = text.match(/<h1[^>]*>(.*?)<\/h1>/i);
                    if (h1Match) title = h1Match[1].trim();
                }
                blogList.innerHTML += `<li><div class="blog-title"><a class="blog-link" href="${post.file}">${title}</a></div></li>`;
                found = true;
            } catch (e) {
                // Ignore errors
            }
        }
        if (!found) document.getElementById('no-posts').style.display = '';
    }
    fetchBlogPosts();
    </script>
</body>
</html>
