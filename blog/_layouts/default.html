<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/blog.css">
</head>
<body>
  <nav class="navbar">
    <div style="display: flex; justify-content: flex-end; gap: 1.5rem; margin-bottom: 0.5rem;">
      <a href="{{ site.baseurl }}/" style="font-weight:600;">Blog Home t.1</a>
      <a href="{{ site.baseurl }}/../index.html" style="font-weight:600;">Author Profile</a>
      {% if page.category or page.categories %}
        <span style="margin-left:2rem; font-weight:600;">Categories: t.2</span>
        {% assign cats = page.categories | default: page.category | split: ' ' %}
        {% for cat in cats %}
          <a href="{{ site.baseurl }}/category/{{ cat | slugify }}/" style="font-weight:600;">{{ cat | capitalize }}</a>
        {% endfor %}
      {% endif %}
    </div>
  </nav>
  <div class="container">
    {{ content }}
  </div>
  <script>
    document.querySelectorAll('pre code').forEach(function(codeBlock) {
      var btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.type = 'button';
      btn.innerText = 'Copy';
      btn.onclick = function() {
        navigator.clipboard.writeText(codeBlock.innerText);
        btn.innerText = 'Copied!';
        setTimeout(function(){ btn.innerText = 'Copy'; }, 1200);
      };
      codeBlock.parentNode.style.position = 'relative';
      codeBlock.parentNode.appendChild(btn);
    });
  </script>
</body>
</html>
