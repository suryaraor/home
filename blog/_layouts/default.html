<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #faf9f7; color: #222; margin: 0; padding: 0; }
    .container { max-width: 700px; margin: 2.5rem auto; background: #fff; border-radius: 10px; box-shadow: 0 2px 16px #0001; padding: 2.5rem; }
    h1 { font-size: 2.2rem; color: #BF5700; margin-bottom: 1.5rem; }
    ul { list-style: none; padding: 0; }
    li { margin-bottom: 1.5rem; }
    a.blog-link { text-decoration: none; color: #BF5700; font-size: 1.25rem; font-weight: 600; }
    a.blog-link:hover { text-decoration: underline; }
    .blog-title { margin-bottom: 0.2rem; }
    .blog-meta { color: #888; font-size: 0.95rem; margin-bottom: 0.5rem; }
    .no-posts { color: #aaa; font-size: 1.1rem; }
    pre code {
      display: block;
      background: #222;
      color: #f8f8f2;
      padding: 1em;
      border-radius: 8px;
      font-size: 1.05em;
      overflow-x: auto;
      position: relative;
    }
    .copy-btn {
      position: absolute;
      top: 8px;
      right: 12px;
      background: #BF5700;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 0.3em 0.8em;
      cursor: pointer;
      font-size: 0.95em;
      opacity: 0.85;
      transition: opacity 0.2s;
      z-index: 2;
    }
    .copy-btn:hover { opacity: 1; }
  </style>
</head>
<body>
  <div class="container">
    {{ content }}
  </div>
  <script>
    document.querySelectorAll('pre code').forEach(function(codeBlock) {
      var btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.type = 'button';
      btn.innerText = 'Copy';
      btn.onclick = function() {
        navigator.clipboard.writeText(codeBlock.innerText);
        btn.innerText = 'Copied!';
        setTimeout(function(){ btn.innerText = 'Copy'; }, 1200);
      };
      codeBlock.parentNode.style.position = 'relative';
      codeBlock.parentNode.appendChild(btn);
    });
  </script>
</body>
</html>
