<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }}</title>
  <style>
    .medium-container {
      max-width: 820px;
      margin: 3rem auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 16px #0001;
      padding: 2.5rem 2rem;
    }
    .medium-container h1, .medium-container h2, .medium-container h3 {
      font-family: 'Georgia', 'Times New Roman', serif;
      color: #222;
      margin-top: 2.2rem;
      margin-bottom: 1.2rem;
    }
    .medium-container h1 {
      font-size: 2.4rem;
      font-weight: 700;
      margin-bottom: 0.7rem;
    }
    .medium-container h2 {
      font-size: 1.7rem;
      border-bottom: 1px solid #eee;
      padding-bottom: 0.3rem;
    }
    .medium-container h3 {
      font-size: 1.25rem;
      color: #444;
    }
    .medium-container p, .medium-container ul, .medium-container li {
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 1.15rem;
      color: #333;
      line-height: 1.7;
      margin-bottom: 1.2rem;
    }
    .medium-container ul {
      padding-left: 1.5rem;
    }
    .medium-container .author-info {
      background: #f8f8f8;
      border-radius: 8px;
      border-left: 4px solid #4CAF50;
      padding: 1rem 1.5rem;
      margin-bottom: 2.2rem;
      font-size: 1rem;
    }
    .medium-container .read-time {
      color: #999;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }
    .medium-container .highlight-box, .medium-container .conclusion-box {
      background: #f6f7f9;
      border-radius: 8px;
      border-left: 4px solid #4CAF50;
      padding: 1.2rem 1.5rem;
      margin: 2rem 0;
      font-size: 1.08rem;
    }
    .medium-container .conclusion-box {
      background: #fff3cd;
      border-left: 4px solid #ffc107;
    }
    .medium-container .code-block {
      background: #222;
      color: #f8f8f2;
      font-family: 'Fira Mono', 'Consolas', 'Courier New', monospace;
      font-size: 1rem;
      border-radius: 8px;
      padding: 1.2rem 1rem;
      margin: 1.5rem 0;
      overflow-x: auto;
    }
    .medium-container .feature-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.2rem;
      margin: 2rem 0;
    }
    .medium-container .feature-card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 1px 4px #0001;
      border-left: 4px solid #2196F3;
      padding: 1rem 1.2rem;
    }
    .medium-container .feature-title {
      font-weight: bold;
      color: #2196F3;
      margin-bottom: 0.5rem;
    }
    .medium-container .architecture-diagram {
      background: #f8f8f8;
      border-radius: 8px;
      box-shadow: 0 1px 4px #0001;
      padding: 1.2rem;
      margin: 2rem 0;
      text-align: center;
    }
    .medium-container em {
      color: #555;
    }
    .medium-container strong {
      color: #222;
    }
    @media (max-width: 800px) {
      .medium-container { padding: 1.2rem 0.5rem; }
    }
  </style>
</head>
<body>
  <div class="medium-container">
    {{ content }}
  </div>
</body>
</html>
